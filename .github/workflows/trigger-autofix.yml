name: Trigger Auto Fix Scan

on:
  push:
    branches: [main, master]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger analysis for this repo
        run: |
          curl -sf -X POST https://error-inbox.vercel.app/api/autofix/analyze \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"repos":["agentos-backend"]}'
